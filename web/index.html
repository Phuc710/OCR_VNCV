<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OCR Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<div class="dashboard">

  <!-- CONTENT -->
  <div class="dash-content">

    <!-- LEFT: Upload + Preview -->
    <div class="col-camera">
      <div class="camera-card">

        <!-- Drop Zone -->
        <div class="video-area" id="dropZone">
          <div class="drop-placeholder" id="dropPlaceholder">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".3">
              <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/>
            </svg>
            <p class="drop-hint">Kéo thả ảnh hoặc click để chọn</p>
            <span class="drop-sub">JPEG · PNG · WEBP · BMP</span>
          </div>
          <img id="previewImg" class="cam-feed" style="display:none" alt="preview" />
        </div>

        <!-- Footer -->
        <div class="cam-footer">
          <div class="cam-footer-left">
            <label class="btn btn-upload" for="fileInput">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
              Chọn ảnh
            </label>
            <input type="file" id="fileInput" accept="image/*" style="display:none" />
            <button class="btn btn-run" id="runBtn" disabled>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>
              Nhận dạng
            </button>
          </div>
          <div class="cam-footer-right">
            <button class="btn btn-clear" id="clearBtn">Xóa</button>
          </div>
        </div>
      </div>
    </div>

    <!-- RIGHT: Result Panel -->
    <div class="col-right">

      <!-- Stats -->
      <div class="right-card summary-card">
        <div class="summary-grid">
          <div class="sum-item">
            <span class="sum-label">Conf</span>
            <span class="sum-val" id="statConf">—</span>
          </div>
          <div class="sum-item">
            <span class="sum-label">Time</span>
            <span class="sum-val" id="statTime">—</span>
          </div>
          <div class="sum-item">
            <span class="sum-label">Chars</span>
            <span class="sum-val" id="statChars">—</span>
          </div>
        </div>
      </div>

      <!-- OCR Text Result -->
      <div class="right-card log-card">
        <div class="rc-header">
          <div class="rc-title-row">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
            Kết quả OCR
          </div>
          <div class="rc-actions">
            <button class="rc-link-btn" id="copyBtn">Copy</button>
          </div>
        </div>

        <div class="alert-log-list" id="resultArea">
          <div class="empty-log" id="emptyState">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".3"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            <div>
              <p class="empty-title">Chưa có kết quả</p>
              <p class="empty-sub">Upload ảnh và nhấn Nhận dạng</p>
            </div>
          </div>
          <div class="empty-log" id="loadingState" style="display:none">
            <svg class="spinner" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" opacity=".7">
              <path d="M12 2A10 10 0 1 0 22 12"/>
            </svg>
            <div>
              <p class="empty-title">Đang xử lý ảnh...</p>
              <p class="empty-sub">Xin vui lòng chờ trong giây lát</p>
            </div>
          </div>
          <pre class="ocr-text" id="ocrText" style="display:none"></pre>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Toast container -->
<div class="toast-container" id="toastContainer"></div>

<script>
// ── Clock ─────────────────────────────────────────────────
const clock = document.getElementById("clock");
if (clock) {
  setInterval(() => {
    clock.textContent = new Date().toLocaleTimeString("vi-VN");
  }, 1000);
}

// ── Elements ──────────────────────────────────────────────
const dropZone      = document.getElementById("dropZone");
const dropPlaceholder = document.getElementById("dropPlaceholder");
const previewImg    = document.getElementById("previewImg");
const fileInput     = document.getElementById("fileInput");
const runBtn        = document.getElementById("runBtn");
const clearBtn      = document.getElementById("clearBtn");
const copyBtn       = document.getElementById("copyBtn");
const statusBadge   = document.getElementById("statusBadge");
const statusDot     = document.getElementById("statusDot");
const statusText    = document.getElementById("statusText");
const modeBadge     = document.getElementById("modeBadge");
const modeText      = document.getElementById("modeText");
const statConf      = document.getElementById("statConf");
const statTime      = document.getElementById("statTime");
const statChars     = document.getElementById("statChars");
const emptyState    = document.getElementById("emptyState");
const loadingState  = document.getElementById("loadingState");
const ocrText       = document.getElementById("ocrText");

let currentFile = null;

// ── File selection ────────────────────────────────────────
function loadFile(file) {
  if (!file || !file.type.startsWith("image/")) {
    toast("Chỉ hỗ trợ file ảnh", "error"); return;
  }
  currentFile = file;
  const reader = new FileReader();
  reader.onload = e => {
    previewImg.src = e.target.result;
    previewImg.style.display = "block";
    dropPlaceholder.style.display = "none";
    runBtn.disabled = false;
    setStatus("READY", "green");
  };
  reader.readAsDataURL(file);
}

fileInput.addEventListener("change", () => loadFile(fileInput.files[0]));

dropZone.addEventListener("dragover", e => { e.preventDefault(); dropZone.classList.add("drag-over"); });
dropZone.addEventListener("dragleave", () => dropZone.classList.remove("drag-over"));
dropZone.addEventListener("drop", e => {
  e.preventDefault();
  dropZone.classList.remove("drag-over");
  loadFile(e.dataTransfer.files[0]);
});
dropZone.addEventListener("click", e => {
  if (e.target === dropZone || e.target === dropPlaceholder || dropPlaceholder.contains(e.target))
    fileInput.click();
});

// ── Run OCR ───────────────────────────────────────────────
runBtn.addEventListener("click", async () => {
  if (!currentFile) return;
  runBtn.disabled = true;
  setStatus("PROCESSING", "blue");
  
  emptyState.style.display = "none";
  ocrText.style.display = "none";
  loadingState.style.display = "flex";

  const fd = new FormData();
  fd.append("file", currentFile);

  const t = toast("Đang nhận dạng…", "loading", 0);
  try {
    const res  = await fetch("/api/ocr", { method: "POST", body: fd });
    const data = await res.json();
    t.remove();

    if (!res.ok) {
      toast(data.detail || "Lỗi server", "error");
      setStatus("ERROR", "red");
      loadingState.style.display = "none";
      emptyState.style.display = "flex";
    } else {
      showResult(data);
      setStatus("DONE", "green");
      toast(`Nhận dạng xong • ${data.elapsed_ms}ms`, "success");
    }
  } catch (e) {
    t.remove();
    toast("Không kết nối được server", "error");
    setStatus("ERROR", "red");
    loadingState.style.display = "none";
    emptyState.style.display = "flex";
  }
  runBtn.disabled = false;
});

// ── Display result ────────────────────────────────────────
function showResult(data) {
  statConf.textContent  = (data.confidence * 100).toFixed(1) + "%";
  statConf.className    = "sum-val " + (data.confidence >= 0.7 ? "green" : data.confidence >= 0.4 ? "amber" : "red");
  statTime.textContent  = data.elapsed_ms + "ms";
  statChars.textContent = data.char_count;

  if (modeText) modeText.textContent  = data.mode;
  if (modeBadge) modeBadge.style.display = "flex";

  loadingState.style.display = "none";
  emptyState.style.display = "none";
  ocrText.textContent = data.text || "(Không nhận dạng được nội dung)";
  ocrText.style.display = "block";
}

// ── Copy ──────────────────────────────────────────────────
copyBtn.addEventListener("click", () => {
  const txt = ocrText.textContent;
  if (!txt || ocrText.style.display === "none") { toast("Chưa có kết quả", "error"); return; }
  navigator.clipboard.writeText(txt).then(() => toast("Đã copy!", "success"));
});

// ── Clear ─────────────────────────────────────────────────
clearBtn.addEventListener("click", () => {
  currentFile = null;
  fileInput.value = "";
  previewImg.src = "";
  previewImg.style.display = "none";
  dropPlaceholder.style.display = "flex";
  runBtn.disabled = true;
  statusBadge.style.display = "none";
  modeBadge.style.display = "none";
  loadingState.style.display = "none";
  emptyState.style.display = "flex";
  ocrText.style.display = "none";
  ocrText.textContent = "";
  statConf.textContent = statTime.textContent = statChars.textContent = "—";
  statConf.className = "sum-val";
});

// ── Helpers ───────────────────────────────────────────────
function setStatus(label, color) {
  if (statusText) statusText.textContent = label;
  if (statusBadge) statusBadge.style.display = "inline-flex";
  const colors = { green: "#10B981", blue: "#3B82F6", red: "#EF4444" };
  if (statusDot) statusDot.style.background = colors[color] || colors.green;
}

function toast(msg, type = "success", duration = 3000) {
  const icons = { success: "✓", error: "✕", loading: "◌" };
  const el = document.createElement("div");
  el.className = `toast ${type}`;
  el.innerHTML = `<span>${icons[type] || "ℹ"}</span> ${msg}`;
  document.getElementById("toastContainer").appendChild(el);
  if (duration > 0) setTimeout(() => { el.classList.add("fade-out"); setTimeout(() => el.remove(), 300); }, duration);
  return el;
}
</script>
</body>
</html>
